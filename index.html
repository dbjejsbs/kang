<!DOCTYPE html>
<html>
<head>
    <title>경찰 초과근무 계산기</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .input-group { margin-bottom: 10px; }
        label { display: inline-block; width: 150px; }
        #result { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>경찰공무원 수당 계산기 (1월 기준)</h2>
    <div class="input-group">
        <label>당직 횟수:</label> <input type="number" id="dangjik" value="8">
    </div>
    <div class="input-group">
        <label>주간 횟수:</label> <input type="number" id="jugan" value="11">
    </div>
    <div class="input-group">
        <label>휴일당직 횟수:</label> <input type="number" id="holiday" value="3">
    </div>
    <button onclick="calculate()">계산하기</button>

    <div id="result">
        <p>결과가 여기에 표시됩니다.</p>
    </div>

    <script>
        function calculate() {
            const dCount = parseInt(document.getElementById('dangjik').value);
            const wCount = parseInt(document.getElementById('jugan').value);
            const hCount = parseInt(document.getElementById('holiday').value);

            // 1. 시간 산정 (질문자님 시스템 기준)
            const totalWork = (dCount * 24) + (wCount * 8); // 총 근무
            const legalTime = 168; // 1월 법정시간
            const holidayDeduction = hCount * 8; // 휴일분 공제
            const otHours = totalWork - legalTime - holidayDeduction; // 시간외 88시간 도출 식
            const nightHours = dCount * 8; // 야간

            // 2. 단가 설정 (이미지 기준)
            const otUnit = 12583;
            const nightUnit = 4194;
            const holidayUnit = 101153;

            // 3. 금액 계산
            const otPay = otHours * otUnit;
            const nightPay = nightHours * nightUnit;
            const holidayPay = hCount * holidayUnit;
            const totalPay = otPay + nightPay + holidayPay;

            document.getElementById('result').innerHTML = `
                <strong>계산 결과 (세전):</strong><br>
                - 시간외수당(${otHours}시간): ${otPay.toLocaleString()}원<br>
                - 야간수당(${nightHours}시간): ${nightPay.toLocaleString()}원<br>
                - 휴일수당(${hCount}일): ${holidayPay.toLocaleString()}원<br><br>
                <strong>총합: ${totalPay.toLocaleString()}원</strong>
            `;
        }
    </script>
</body>
</html>
